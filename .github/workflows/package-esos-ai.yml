name: Package ESOS AI 4.0.1

on:
  push:
    branches:
      - release/esos-ai-4.0.1-package
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest
        run: |
          node -e "const m=require('./manifest.json'); if(m.name!=='ESOS AI'||m.version!=='4.0.1') process.exit(1); console.log(m.name, m.version)"
      - name: Build installable ZIP
        run: |
          mkdir -p dist/esos-ai
          cp manifest.json popup.html popup.js manual-import-fixes.js background-worker.js background.js position-profile-parser.js content.js xing-search-location.js icon16.png icon48.png icon128.png dist/esos-ai/
          cd dist/esos-ai
          zip -9 -r ../ESOS-AI-4.0.1.zip .
      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: ESOS-AI-4.0.1
          path: dist/ESOS-AI-4.0.1.zip
          retention-days: 30
