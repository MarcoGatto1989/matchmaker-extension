name: ESOS AI branding cleanup

on:
  push:
    branches:
      - rebrand/esos-ai

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[esos-ai-cleanup-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebrand/esos-ai
          fetch-depth: 0

      - name: Replace legacy branding
        run: |
          python3 - <<'PY'
          from pathlib import Path

          skip_dirs = {'.git', 'node_modules'}
          text_suffixes = {'.js', '.mjs', '.cjs', '.ts', '.tsx', '.jsx', '.json', '.html', '.css', '.md', '.py', '.yml', '.yaml', '.txt'}
          replacements = [
              ('MatchMaker BOOT', 'ESOS AI'),
              ('MatchMaker Boot', 'ESOS AI'),
              ('Matchmaker BOOT', 'ESOS AI'),
              ('Matchmaker Boot', 'ESOS AI'),
              ('Matchmaker BOot', 'ESOS AI'),
              ('BOOT API', 'ESOS AI API'),
              ('BOOT Extension', 'ESOS AI Extension'),
              ('[BOOT]', '[ESOS AI]'),
              ('Unbekannter BOOT-Fehler', 'Unbekannter ESOS-AI-Fehler'),
              ('_boot_extension', '_esos_ai_extension'),
          ]

          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in skip_dirs for part in path.parts):
                  continue
              if path.as_posix() == '.github/workflows/esos-ai-rebrand.yml':
                  continue
              if path.suffix.lower() not in text_suffixes and path.name not in {'Dockerfile'}:
                  continue
              try:
                  old = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = old
              for source, target in replacements:
                  new = new.replace(source, target)
              if new != old:
                  path.write_text(new, encoding='utf-8')
          PY

      - name: Verify visible legacy brand is gone
        run: |
          if grep -RniE 'MatchMaker[[:space:]]+(BOOT|Boot)|Matchmaker[[:space:]]+(BOOT|Boot|BOot)' . \
            --exclude-dir=.git --exclude-dir=node_modules --exclude=esos-ai-rebrand.yml; then
            echo 'Legacy MatchMaker BOOT branding still found.'
            exit 1
          fi

      - name: Commit cleanup
        run: |
          git config user.name "ESOS AI Rebrand"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Replace remaining legacy branding [esos-ai-cleanup-done]"
          git push origin HEAD:rebrand/esos-ai
