name: Migrate ESOS API endpoint

on:
  push:
    branches:
      - fix/esos-api-endpoint

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/esos-api-endpoint
      - name: Replace legacy endpoint and migrate saved settings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          legacy = 'https://executive-sphere-production.up.railway.app'
          current = 'https://esos-web-production.up.railway.app'
          skip = Path('.github/workflows/migrate-esos-api-endpoint.yml')

          for path in root.rglob('*'):
              if not path.is_file() or path == skip or '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              if legacy in text:
                  path.write_text(text.replace(legacy, current))

          background = Path('background.js')
          text = background.read_text()
          old = """function getApiBase() {
            return new Promise(resolve => {
              chrome.storage.local.get('esos_url', res => {
                const url = (res.esos_url || DEFAULT_API_BASE).replace(/\\/$/, '');
                resolve(url);
              });
            });
          }
          """
          new = """function normalizeStoredEsosUrl(value) {
            const raw = String(value || '').trim().replace(/\\/$/, '');
            if (!raw) return DEFAULT_API_BASE;
            try {
              const parsed = new URL(raw);
              const defaultHost = new URL(DEFAULT_API_BASE).hostname;
              if (parsed.hostname.endsWith('.up.railway.app') && parsed.hostname !== defaultHost) {
                return DEFAULT_API_BASE;
              }
            } catch (_) {}
            return raw;
          }

          function getApiBase() {
            return new Promise(resolve => {
              chrome.storage.local.get('esos_url', res => {
                const url = normalizeStoredEsosUrl(res.esos_url);
                if (res.esos_url && url !== String(res.esos_url).replace(/\\/$/, '')) {
                  chrome.storage.local.set({ esos_url: url });
                }
                resolve(url);
              });
            });
          }
          """
          if old not in text:
              raise SystemExit('background getApiBase marker not found')
          background.write_text(text.replace(old, new, 1))

          popup = Path('popup.js')
          text = popup.read_text()
          old = """function getEsosUrl(settings) {
            return (settings?.esos_url || 'https://esos-web-production.up.railway.app').replace(/\\/$/, '');
          }
          """
          new = """const DEFAULT_ESOS_URL = 'https://esos-web-production.up.railway.app';

          function getEsosUrl(settings) {
            const configured = String(settings?.esos_url || '').trim().replace(/\\/$/, '');
            if (!configured) return DEFAULT_ESOS_URL;
            try {
              const parsed = new URL(configured);
              const defaultHost = new URL(DEFAULT_ESOS_URL).hostname;
              if (parsed.hostname.endsWith('.up.railway.app') && parsed.hostname !== defaultHost) {
                chrome.storage.local.set({ esos_url: DEFAULT_ESOS_URL });
                return DEFAULT_ESOS_URL;
              }
            } catch (_) {}
            return configured;
          }
          """
          if old not in text:
              raise SystemExit('popup getEsosUrl marker not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              "esosUrlInput.value = settings.esos_url || 'https://esos-web-production.up.railway.app';",
              "esosUrlInput.value = getEsosUrl(settings);"
          )
          popup.write_text(text)

          manifest = Path('manifest.json')
          data = json.loads(manifest.read_text())
          data['version'] = '4.0.1'
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          leftovers = []
          for path in root.rglob('*'):
              if not path.is_file() or path == skip or '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              if 'executive-sphere' in text.lower():
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('Legacy endpoint remains in: ' + ', '.join(leftovers))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- background.js popup.js manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: route ESOS AI through neutral ESOS endpoint"
          git push origin HEAD:fix/esos-api-endpoint
