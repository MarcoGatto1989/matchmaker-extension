name: Validate ESOS extension

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test branding.test.mjs domain-routing.test.mjs extension-token-selfheal.test.mjs queue-response-guard.test.mjs
