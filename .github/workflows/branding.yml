name: Validate ESOS extension

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test branding.test.mjs domain-routing.test.mjs extension-token-selfheal.test.mjs queue-response-guard.test.mjs linkedin-position-background.test.mjs network-sync-linkedhelper-flow.test.mjs unified-extension-v410.contract.test.mjs linkedhelper-auto-panel-v421.contract.test.mjs

      - name: Build installable extension ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rm -f ESOS_AI_Unified_4.1.2.zip
          zip -r ESOS_AI_Unified_4.1.2.zip .             -x '.git/*' '.github/*' '*.test.mjs' 'ESOS_AI_Unified_4.1.2.zip'
      - name: Upload installable extension ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ESOS_AI_Unified_4.1.2
          path: ESOS_AI_Unified_4.1.2.zip
          if-no-files-found: error
