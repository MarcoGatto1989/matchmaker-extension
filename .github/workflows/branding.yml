name: Validate ESOS extension branding

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node branding.test.mjs
