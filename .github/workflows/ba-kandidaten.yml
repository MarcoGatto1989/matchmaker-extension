name: BA Kandidaten

on:
  pull_request:
    branches: [main]
    paths:
      - 'ba-candidate-assistant/**'
      - '.github/workflows/ba-kandidaten.yml'
  push:
    branches: [main]
    paths:
      - 'ba-candidate-assistant/**'
      - '.github/workflows/ba-kandidaten.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Run BA Kandidaten tests
        working-directory: ba-candidate-assistant
        run: npm test
      - name: Run syntax checks
        working-directory: ba-candidate-assistant
        run: npm run check
